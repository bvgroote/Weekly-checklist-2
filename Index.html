<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly Checklist</title>
  <style>
    :root { --border:#e6e6e6; --text:#111; --muted:#666; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 24px;
      color: var(--text);
    }

    .wrap { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 14px; }

    .topbar {
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom: 8px;
    }

    .weekof { font-weight: 700; }

    .pill {
      border:1px solid var(--border);
      border-radius:999px;
      padding:6px 10px;
      font-size: 13px;
      color: var(--muted);
    }

    button {
      border:1px solid var(--border);
      background:#fff;
      border-radius:10px;
      padding:8px 12px;
      font-size:14px;
      cursor:pointer;
    }
    button:hover { background:#fafafa; }

    /* ✅ Progress bar */

    .progressWrap {
      width:100%;
      margin: 6px 0 14px;
    }

    .progressBar {
      width:100%;
      height:10px;
      background:#eee;
      border-radius:999px;
      overflow:hidden;
    }

    #progressFill {
      height:100%;
      width:0%;
      background:#d9534f; /* starts red */
      transition: width 0.25s ease, background 0.25s ease;
    }

    .progressText {
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
    }

    .card {
      border:1px solid var(--border);
      border-radius:14px;
      padding: 14px;
    }

    .row {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom:1px solid var(--border);
    }
    .row:last-child { border-bottom:none; }

    .label { font-weight:700; letter-spacing:.2px; }
    .sublabel { font-weight:600; color: var(--muted); }

    .checks {
      display:flex;
      gap: 8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .checks input[type="checkbox"] {
      width: 15px;
      height: 15px;
    }

    .sectionTitle {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 10px 0 6px;
    }

    .sectionTitle .label { font-size:16px; }

    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }

    .divider { height: 10px; }
  </style>
</head>

<body>
<div class="wrap">
  <h1>Weekly Checklist</h1>

  <div class="topbar">
    <div class="weekof">WEEK OF: <span id="weekStartText"></span></div>
    <div class="pill" id="storageKeyText"></div>
    <button id="resetBtn" type="button">Reset this week</button>
    <button id="exportBtn" type="button">Export</button>
    <button id="importBtn" type="button">Import</button>
  </div>

  <!-- ✅ Progress bar -->
  <div class="progressWrap">
    <div class="progressBar">
      <div id="progressFill"></div>
    </div>
    <div id="progressText" class="progressText">0%</div>
  </div>

  <div class="card" id="app"></div>

  <div class="hint">
    Saves on this device/browser using localStorage. Weekly reset is automatic.
  </div>
</div>

<script>
/** ----- Week logic ----- **/
function getWeekStartISO(date = new Date()) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const day = d.getDay();
  const diffToMonday = (day === 0) ? -6 : (1 - day);
  d.setDate(d.getDate() + diffToMonday);
  return d.toISOString().slice(0, 10);
}

function formatISO(iso) {
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, {
    weekday:'short', day:'2-digit', month:'short', year:'numeric'
  });
}

/** ----- Model ----- **/
const MODEL = [
  {
    id: "viet_section",
    section: true,
    label: "VIETNAMESE",
    rows: [
      { id: "viet_trang", label: "VIET (NC với Người việt)", counts: 7 },
      { id: "viet_f4t", label: "F4T", counts: 2 },
      { id: "viet_anki", label: "ANKI", counts: 5 },
      { id: "viet_xem", label: "XEM HAY NGHE", counts: 5 },
      { id: "minhquan", label: "MINH QUÂN", counts: 1 },
    ]
  },
  { id: "yoga", label: "YOGA / STRETCH", counts: 4 },
  { id: "cardio", label: "CARDIO", counts: 1 },
  { id: "strength", label: "STRENGTH", counts: 3 },
  { id: "trangotis", label: "TRANG AND OTIS", counts: 2 },
  { id: "notdrinking", label: "NO DRINKS DAYS", counts: 3 },
];

/** ----- Storage ----- **/
function getStorageKey() {
  return `weekly-checklist:${getWeekStartISO()}`;
}

function loadState(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveState(key, state) {
  localStorage.setItem(key, JSON.stringify(state));
}

function buildEmptyState() {
  const state = {};
  for (const item of MODEL) {
    if (item.section) {
      for (const r of item.rows) state[r.id] = Array(r.counts).fill(false);
    } else {
      state[item.id] = Array(item.counts).fill(false);
    }
  }
  return state;
}

/** ----- Progress ----- **/
function updateProgress() {
  let total = 0;
  let done = 0;

  for (const key in state) {
    const arr = state[key];
    total += arr.length;
    done += arr.filter(Boolean).length;
  }

  const pct = total ? Math.round((done / total) * 100) : 0;

  const fill = document.getElementById("progressFill");
  const text = document.getElementById("progressText");

  if (fill) {
    fill.style.width = pct + "%";

    // 🔴🟠🟢 colour ramp
    if (pct < 40) fill.style.background = "#d9534f";      // red
    else if (pct < 75) fill.style.background = "#f0ad4e"; // amber
    else fill.style.background = "#4caf50";                // green
  }

  if (text) text.textContent = `${pct}% (${done}/${total})`;
}

/** ----- Render ----- **/
const appEl = document.getElementById("app");
const weekStartISO = getWeekStartISO();
const storageKey = getStorageKey();

document.getElementById("weekStartText").textContent = formatISO(weekStartISO);
document.getElementById("storageKeyText").textContent = storageKey;

let state = loadState(storageKey) ?? buildEmptyState();
saveState(storageKey, state);

function render() {
  appEl.innerHTML = "";

  for (const item of MODEL) {
    if (item.section) {
      const title = document.createElement("div");
      title.className = "sectionTitle";
      title.innerHTML =
        `<div class="label">${item.label}</div><div class="sublabel">weekly targets</div>`;
      appEl.appendChild(title);

      for (const r of item.rows) {
        appEl.appendChild(renderRow(r.id, r.label, r.counts));
      }

      const div = document.createElement("div");
      div.className = "divider";
      appEl.appendChild(div);
    } else {
      appEl.appendChild(renderRow(item.id, item.label, item.counts));
    }
  }

  updateProgress();
}

function renderRow(rowId, label, counts) {
  const row = document.createElement("div");
  row.className = "row";

  const left = document.createElement("div");
  left.className = "label";
  left.textContent = label;

  const right = document.createElement("div");
  right.className = "checks";

  const arr = (state[rowId] ?? []).slice(0, counts);
  while (arr.length < counts) arr.push(false);
  state[rowId] = arr;

  for (let i = 0; i < counts; i++) {
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!arr[i];
    cb.addEventListener("change", () => {
      state[rowId][i] = cb.checked;
      saveState(storageKey, state);
      localStorage.setItem(storageKey, JSON.stringify(state));
      updateProgress();
    });
    right.appendChild(cb);
  }

  row.appendChild(left);
  row.appendChild(right);
  return row;
}

/** ----- Buttons ----- **/
document.getElementById("resetBtn").addEventListener("click", () => {
  state = buildEmptyState();
  saveState(storageKey, state);
  render();
});

document.getElementById("exportBtn").addEventListener("click", async () => {
  const payload = { storageKey, weekStartISO, state };
  const txt = JSON.stringify(payload, null, 2);
  try {
    await navigator.clipboard.writeText(txt);
    alert("Copied export JSON to clipboard.");
  } catch {
    prompt("Copy this JSON:", txt);
  }
});

document.getElementById("importBtn").addEventListener("click", () => {
  const input = prompt("Paste export JSON here:");
  if (!input) return;
  try {
    const payload = JSON.parse(input);
    if (!payload.state) throw new Error("No state found");
    state = payload.state;
    saveState(storageKey, state);
    render();
    alert("Imported into this week.");
  } catch (e) {
    alert("Import failed: " + e.message);
  }
});

render();

/** Chrome mobile fixes */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    const fresh = loadState(storageKey);
    if (fresh) {
      state = fresh;
      render();
    }
  }
});

window.addEventListener("pagehide", () => {
  saveState(storageKey, state);
});
</script>
</body>
</html>
